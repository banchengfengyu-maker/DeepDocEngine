[package]
name = "deepdoc-parsers"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
deepdoc-protocol = { path = "../protocol" }
deepdoc-source-fs = { path = "../source-fs" }
deepdoc-unpacker = { path = "../unpacker" }
acadrust = { path = "../acadrust" }
encoding_rs = "0.8"
chardetng = "1.0"
calamine = "0.26"
zip = "~2.4.0"
quick-xml = "0.31"
csv = "1.4"
mail-parser = "0.11"
cfb = "0.16"
dxf = "0.6"
image = "0.25"
tiff = "0.11"
gif = "0.14"
png = "0.18"
kamadak-exif = "0.6"
flate2 = "1.1"
lopdf = "0.47"
dbase = "0.8"
jetdb = "0.4"
mobi = "0.8"
msoffice-crypto = { version = "0.1.0-rc.13", features = ["crypto-ops", "legacy-binary"] }
rusqlite = { version = "0.41", features = ["bundled"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic", "directml"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
zstd = "0.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
windows = { version = "0.61", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Globalization",
    "Storage_Streams",
    "Win32_Graphics_Dxgi",
] }
