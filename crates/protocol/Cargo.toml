[package]
name = "deepdoc-protocol"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
async-io = ["dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
serde_bytes = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-util"], optional = true }
