[package]
name = "deepdoc-indexer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
deepdoc-protocol = { path = "../protocol" }
deepdoc-rule-engine = { path = "../rule-engine" }
tantivy = "0.27"
jieba-rs = "0.11"
rusqlite = { version = "0.41", features = ["bundled"] }
zstd = "0.14"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
